services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: health_monitoring
      POSTGRES_USER: health
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - health-network

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - health-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://health:password@db:5432/health_monitoring?schema=public
      MQTT_URL: mqtt://mqtt:1883
      JWT_SECRET: change-this-development-secret
      PORT: 3003
      NODE_ENV: production
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    networks:
      - health-network

  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:3003
      VITE_SOCKET_URL: http://localhost:3003
    depends_on:
      - backend
    networks:
      - health-network

volumes:
  postgres_data:
  mqtt_data:
  mqtt_log:

networks:
  health-network:
    driver: bridge